<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">

    <h2>TaskFlow</h2>

    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="stats.html">الإحصائيات</a>
      <a href="login.html">تسجيل الخروج</a>
    </nav>

    <button id="themeBtn">
      🌙 تغيير الوضع
    </button>

  </aside>

  <main class="main">

    <header>

      <div>
        <h1>مرحبًا  👋</h1>
        <p id="date"></p>
      </div>

    </header>

    <section class="stats">

      <div class="card">
        <h3>كل المهام</h3>
        <span id="totalTasks">0</span>
      </div>

      <div class="card">
        <h3>المكتملة</h3>
        <span id="completedTasks">0</span>
      </div>

      <div class="card">
        <h3>المتبقية</h3>
        <span id="remainingTasks">0</span>
      </div>

    </section>

    <section class="task-box">

      <div class="top">

        <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">

        <button id="addTaskBtn">
          إضافة
        </button>

      </div>

      <ul id="taskList"></ul>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
